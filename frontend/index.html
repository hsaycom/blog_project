<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Блог</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Блог</h1>
        <nav>
            <a href="#register">Регистрация</a>
            <a href="#new-post">Новый пост</a>
            <a href="#posts">Посты</a>
        </nav>
    </header>

    <main>
        <section id="register">
            <h2>Регистрация</h2>
            <form id="register-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       minlength="3" maxlength="255" autocomplete="email">

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       minlength="8" maxlength="128" autocomplete="new-password">

                <button type="submit">Зарегистрироваться</button>
            </form>
            <p id="register-message" role="status"></p>
        </section>

        <section id="new-post">
            <h2>Новый пост</h2>
            <form id="post-form">
                <label for="title">Заголовок</label>
                <input type="text" id="title" name="title" required maxlength="100">

                <label for="content">Текст</label>
                <textarea id="content" name="content" rows="6" required
                          maxlength="5000"></textarea>

                <button type="submit">Опубликовать</button>
            </form>
            <p id="post-message" role="status"></p>
        </section>

        <section id="posts">
            <h2>Посты</h2>
            <button type="button" id="reload-posts">Обновить</button>

            <p id="posts-message" role="status"></p>
            <ul id="posts-list"></ul>
        </section>
    </main>
</body>
</html>
